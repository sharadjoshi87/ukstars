<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Paper Trade Journal (Google Sheets Backend)</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-gray-100 min-h-screen p-4 font-sans max-w-md mx-auto relative">

  <header class="mb-4 text-center">
    <div class="flex justify-between items-center mb-1">
      <span class="text-[10px] bg-emerald-900/40 text-emerald-400 px-2 py-0.5 rounded border border-emerald-700/50">Google Sheets Sync</span>
      <button onclick="loadTradesFromSheet()" class="text-xs text-gray-300 hover:text-white flex items-center gap-1 bg-gray-800 px-2.5 py-1 rounded border border-gray-700 hover:border-emerald-500 transition">
        🔄 Refresh Data
      </button>
    </div>
    <h1 class="text-2xl font-bold text-emerald-400">📈 Paper Trade Journal</h1>
    <p class="text-xs text-gray-400 mt-0.5">Track open & closed positions via Google Sheets</p>
  </header>

  <!-- Metrics Section -->
  <section class="grid grid-cols-3 gap-2 mb-4">
    <div class="bg-gray-800 p-2.5 rounded-lg text-center border border-gray-700">
      <span class="text-[11px] text-gray-400 block">Realized P&L</span>
      <span id="totalPl" class="text-xs font-bold text-gray-200">₹0</span>
    </div>
    <div class="bg-gray-800 p-2.5 rounded-lg text-center border border-gray-700">
      <span class="text-[11px] text-gray-400 block">Win Rate</span>
      <span id="winRate" class="text-xs font-bold text-emerald-400">0%</span>
    </div>
    <div class="bg-gray-800 p-2.5 rounded-lg text-center border border-gray-700">
      <span class="text-[11px] text-gray-400 block">Active Trades</span>
      <span id="activeCount" class="text-xs font-bold text-amber-400">0</span>
    </div>
  </section>

  <!-- Global Search -->
  <section class="mb-5">
    <input type="text" id="searchInput" placeholder="🔍 Search stock ticker or setup..." class="w-full bg-gray-800 border border-gray-700 rounded-lg p-2 pl-3 text-xs text-white focus:outline-none focus:border-emerald-500">
  </section>

  <!-- Log Trade Form -->
  <section class="bg-gray-800 p-4 rounded-xl border border-gray-700 mb-6">
    <h2 class="text-sm font-semibold text-gray-200 mb-3">Log New Entry</h2>

    <form id="tradeForm" class="space-y-3">
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Stock Ticker</label>
          <input type="text" id="symbol" placeholder="e.g. RELIANCE" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500 uppercase">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Entry Date</label>
          <input type="date" id="entryDate" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>
      
      <div class="grid grid-cols-2 gap-2">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Buy Price (₹)</label>
          <input type="number" step="0.05" id="buyPrice" placeholder="472.00" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Quantity</label>
          <input type="number" id="quantity" placeholder="100" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div>
        <label class="block text-xs text-gray-400 mb-1">Trade Type</label>
        <select id="type" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
          <option value="BUY" selected>BUY</option>
          <option value="SELL">SELL</option>
        </select>
      </div>

      <button type="submit" id="submitBtn" class="w-full bg-emerald-600 hover:bg-emerald-500 text-white font-medium py-2 rounded-lg text-xs transition">
        Open Position
      </button>
    </form>
  </section>

  <!-- Open Trades Section -->
  <section class="mb-6">
    <h2 class="text-sm font-semibold text-amber-400 mb-2 flex items-center gap-1.5">
      <span>⏳ Open Positions</span>
    </h2>
    <div id="openTradeList" class="space-y-2"></div>
  </section>

  <!-- Closed Trades Section -->
  <section class="mb-8">
    <h2 class="text-sm font-semibold text-gray-200 mb-2">Closed History</h2>
    <div id="closedTradeList" class="space-y-2"></div>
  </section>

  <!-- Exit Position Modal -->
  <div id="closeModal" class="hidden fixed inset-0 bg-black/75 flex items-center justify-center p-4 z-50">
    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 w-full max-w-xs">
      <h3 class="text-sm font-bold text-gray-100 mb-2" id="modalTitle">Close Trade</h3>
      
      <div class="space-y-3 mb-3">
        <div>
          <label class="block text-xs text-gray-400 mb-1">Exit Date</label>
          <input type="date" id="exitDateInput" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
        <div>
          <label class="block text-xs text-gray-400 mb-1">Selling Price (₹)</label>
          <input type="number" step="0.05" id="exitPriceInput" placeholder="492.00" required class="w-full bg-gray-900 border border-gray-700 rounded p-2 text-xs text-white focus:outline-none focus:border-emerald-500">
        </div>
      </div>

      <div class="flex gap-2">
        <button id="confirmCloseBtn" class="flex-1 bg-emerald-600 text-white text-xs font-medium py-2 rounded">Confirm Exit</button>
        <button id="cancelModalBtn" class="bg-gray-700 text-gray-300 text-xs font-medium px-3 py-2 rounded">Cancel</button>
      </div>
    </div>
  </div>

  <script>
    // ⚠️ REPLACE THIS WITH YOUR DEPLOYED GOOGLE APPS SCRIPT URL
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzPslWyd37icMjd8fT1Vc_AO8MYd2Rtw_pg11uR5QEFDI3yC1GxCTkhe56bT0XIemc/exec";

    let trades = [];
    let activeClosingId = null;

    const todayStr = new Date().toISOString().split('T')[0];
    document.getElementById('entryDate').value = todayStr;
    document.getElementById('exitDateInput').value = todayStr;

    const tradeForm = document.getElementById('tradeForm');
    const submitBtn = document.getElementById('submitBtn');
    const openTradeList = document.getElementById('openTradeList');
    const closedTradeList = document.getElementById('closedTradeList');
    const totalPlEl = document.getElementById('totalPl');
    const winRateEl = document.getElementById('winRate');
    const activeCountEl = document.getElementById('activeCount');
    const closeModal = document.getElementById('closeModal');
    const exitPriceInput = document.getElementById('exitPriceInput');
    const exitDateInput = document.getElementById('exitDateInput');
    const modalTitle = document.getElementById('modalTitle');
    const searchInput = document.getElementById('searchInput');

    // Fetch Trades from Google Sheet
    async function loadTradesFromSheet() {
      openTradeList.innerHTML = '<p class="text-center text-[11px] text-gray-400 py-2">Loading from Google Sheet...</p>';
      try {
        const response = await fetch(SCRIPT_URL);
        const data = await response.json();
        
        // Normalize keys and format types
        trades = data.map(item => ({
          id: item.id,
          symbol: String(item.symbol || '').toUpperCase(),
          type: item.type || 'BUY',
          quantity: parseInt(item.qty || 0),
          buyPrice: parseFloat(item.entryPrice || 0),
          sellPrice: item.exitPrice ? parseFloat(item.exitPrice) : null,
          status: item.status || 'OPEN',
          entryDate: item.entryDate || '',
          exitDate: item.exitDate || '',
          holdingDays: item['Holding Days'] || item.holdingDays || 0
        }));

        renderTrades();
        updateMetrics();
      } catch (error) {
        console.error("Error loading trades:", error);
        openTradeList.innerHTML = '<p class="text-center text-[11px] text-red-400 py-2">Failed to connect to Google Sheet backend.</p>';
      }
    }

    // Save New Trade to Google Sheet
    tradeForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      submitBtn.innerText = '⏳ Saving...';
      submitBtn.disabled = true;

      const newTrade = {
        id: Date.now().toString(),
        symbol: document.getElementById('symbol').value.toUpperCase().trim(),
        type: document.getElementById('type').value,
        qty: parseInt(document.getElementById('quantity').value),
        entryPrice: parseFloat(document.getElementById('buyPrice').value),
        exitPrice: "",
        status: "OPEN",
        entryDate: document.getElementById('entryDate').value,
        exitDate: ""
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "ADD_TRADE", trade: newTrade })
        });
        
        tradeForm.reset();
        document.getElementById('entryDate').value = todayStr;
        await loadTradesFromSheet();
      } catch (error) {
        alert("Failed to save trade to Google Sheet.");
      } finally {
        submitBtn.innerText = 'Open Position';
        submitBtn.disabled = false;
      }
    });

    // Open Close Position Modal
    function promptClose(id) {
      activeClosingId = id;
      const trade = trades.find(t => t.id == id);
      modalTitle.innerText = `Close ${trade.symbol} (${trade.quantity} Qty)`;
      exitPriceInput.value = trade.buyPrice;
      exitDateInput.value = todayStr;
      closeModal.classList.remove('hidden');
    }

    document.getElementById('cancelModalBtn').addEventListener('click', () => closeModal.classList.add('hidden'));

    // Confirm Close Position & Update Google Sheet
    document.getElementById('confirmCloseBtn').addEventListener('click', async () => {
      const sellPrice = parseFloat(exitPriceInput.value);
      const exitDate = exitDateInput.value;

      if (!sellPrice || sellPrice <= 0) return alert('Enter valid sell price');
      if (!exitDate) return alert('Select exit date');

      const trade = trades.find(t => t.id == activeClosingId);
      if (!trade) return;

      closeModal.classList.add('hidden');
      openTradeList.innerHTML = '<p class="text-center text-[11px] text-gray-400 py-2">Updating trade status...</p>';

      const updatedTrade = {
        id: String(trade.id),
        symbol: trade.symbol,
        type: trade.type,
        qty: trade.quantity,
        entryPrice: trade.buyPrice,
        exitPrice: sellPrice,
        status: "CLOSED",
        entryDate: trade.entryDate,
        exitDate: exitDate
      };

      try {
        await fetch(SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ action: "ADD_TRADE", trade: updatedTrade })
        });
        await loadTradesFromSheet();
      } catch (error) {
        alert("Failed to update trade status.");
        loadTradesFromSheet();
      }
    });

    searchInput.addEventListener('input', renderTrades);

    function formatDate(dateString) {
      if (!dateString) return '-';
      const d = new Date(dateString);
      return isNaN(d) ? dateString : d.toLocaleDateString('en-IN', { day: '2-digit', month: 'short' });
    }

    function updateMetrics() {
      const openTrades = trades.filter(t => t.status === 'OPEN');
      const closedTrades = trades.filter(t => t.status === 'CLOSED');

      activeCountEl.innerText = openTrades.length;

      if (closedTrades.length === 0) {
        totalPlEl.innerText = '₹0';
        totalPlEl.className = 'text-xs font-bold text-gray-200';
        winRateEl.innerText = '0%';
        return;
      }

      const totalPl = closedTrades.reduce((sum, t) => sum + ((t.sellPrice - t.buyPrice) * t.quantity), 0);
      const wins = closedTrades.filter(t => (t.sellPrice - t.buyPrice) > 0).length;
      const winRate = ((wins / closedTrades.length) * 100).toFixed(0);

      totalPlEl.innerText = `₹${totalPl.toLocaleString('en-IN')}`;
      totalPlEl.className = `text-xs font-bold ${totalPl >= 0 ? 'text-emerald-400' : 'text-red-400'}`;
      winRateEl.innerText = `${winRate}%`;
    }

    function renderTrades() {
      openTradeList.innerHTML = '';
      closedTradeList.innerHTML = '';

      const query = searchInput.value.toLowerCase().trim();
      const openTrades = trades.filter(t => t.status === 'OPEN' && t.symbol.toLowerCase().includes(query));
      const closedTrades = trades.filter(t => t.status === 'CLOSED' && t.symbol.toLowerCase().includes(query));

      if (openTrades.length === 0) {
        openTradeList.innerHTML = '<p class="text-center text-[11px] text-gray-500 py-2">No active open positions found.</p>';
      } else {
        openTrades.forEach(t => {
          const card = document.createElement('div');
          card.className = 'bg-gray-800 p-3 rounded-lg border-l-4 border-amber-400 border-y border-r border-gray-700 space-y-2';
          card.innerHTML = `
            <div class="flex justify-between items-start">
              <div>
                <div class="flex items-center gap-1.5 flex-wrap mb-1">
                  <span class="font-bold text-gray-100 text-xs">${t.symbol}</span>
                  <span class="text-[9px] bg-gray-700 text-gray-300 px-1 py-0.5 rounded">${t.type}</span>
                  <span class="text-[9px] bg-blue-900/60 text-blue-300 border border-blue-700/50 px-1 py-0.5 rounded">⏱️ ${t.holdingDays} days open</span>
                </div>
                <div class="text-[11px] text-gray-300 font-medium">
                  Amount: <strong class="text-white">₹${(t.buyPrice * t.quantity).toLocaleString('en-IN')}</strong> 
                  <span class="text-gray-400 text-[10px]">(₹${t.buyPrice} × ${t.quantity} Qty)</span>
                </div>
                <div class="text-[10px] text-gray-400 mt-0.5">📅 Entry: ${formatDate(t.entryDate)}</div>
              </div>
              <button onclick="promptClose('${t.id}')" class="bg-amber-500 hover:bg-amber-600 text-black text-[11px] font-bold px-2.5 py-1 rounded">Close</button>
            </div>
          `;
          openTradeList.appendChild(card);
        });
      }

      if (closedTrades.length === 0) {
        closedTradeList.innerHTML = '<p class="text-center text-[11px] text-gray-500 py-2">No closed trades found.</p>';
      } else {
        closedTrades.forEach(t => {
          const pl = (t.sellPrice - t.buyPrice) * t.quantity;
          const returnPct = (((t.sellPrice - t.buyPrice) / t.buyPrice) * 100).toFixed(2);
          const isProfit = pl >= 0;

          const card = document.createElement('div');
          card.className = `bg-gray-800 p-2.5 rounded-lg border-l-4 ${isProfit ? 'border-emerald-500' : 'border-red-500'} border-y border-r border-gray-700 flex justify-between items-center`;
          card.innerHTML = `
            <div>
              <div class="flex items-center gap-1.5 flex-wrap">
                <span class="font-bold text-gray-100 text-xs">${t.symbol}</span>
                <span class="text-[9px] bg-blue-900/60 text-blue-300 border border-blue-700/50 px-1 py-0.5 rounded">⏱️ Held: ${t.holdingDays} days</span>
              </div>
              <div class="text-[10px] text-gray-400 mt-0.5">
                📅 ${formatDate(t.entryDate)} ➔ ${formatDate(t.exitDate)}
              </div>
              <div class="text-[11px] text-gray-400 mt-0.5">
                Buy: ₹${t.buyPrice} | Exit: ₹${t.sellPrice} | Qty: ${t.quantity}
              </div>
            </div>
            <div class="text-right">
              <div class="text-xs font-bold ${isProfit ? 'text-emerald-400' : 'text-red-400'}">
                ${isProfit ? '+' : ''}₹${pl.toLocaleString('en-IN')}
              </div>
              <div class="text-[9px] ${isProfit ? 'text-emerald-400' : 'text-red-400'}">
                ${isProfit ? '+' : ''}${returnPct}%
              </div>
            </div>
          `;
          closedTradeList.appendChild(card);
        });
      }
    }

    // Initial load on page start
    loadTradesFromSheet();
  </script>
</body>
</html>
